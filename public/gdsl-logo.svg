<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Outer Arc for GALGOTIAS UNIVERSITY -->
    <path id="topTextArc" d="M 68,250 A 182,182 0 1,1 432,250" fill="none" />
    <!-- Lower Arc for G.C.D.I.S -->
    <path id="bottomTextArc" d="M 72,250 A 178,178 0 0,0 428,250" fill="none" />
    
    <!-- Gradients for Galgotias Center Flame/Bird Motif -->
    <linearGradient id="redFlame" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b91c1c" />
      <stop offset="50%" stop-color="#dc2626" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
    <linearGradient id="yellowFlame" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="40%" stop-color="#facc15" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <linearGradient id="cyanFlame" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
  </defs>

  <!-- Background White Circle -->
  <circle cx="250" cy="250" r="244" fill="#ffffff" />

  <!-- Outermost Navy Blue Ring -->
  <circle cx="250" cy="250" r="240" fill="none" stroke="#091b42" stroke-width="12" />

  <!-- Arced Top Text: GALGOTIAS UNIVERSITY -->
  <text fill="#091b42" font-family="'Inter', -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="34" letter-spacing="4px">
    <textPath href="#topTextArc" startOffset="50%" text-anchor="middle">
      GALGOTIAS UNIVERSITY
    </textPath>
  </text>

  <!-- Arced Bottom Text: G . C . D . I . S -->
  <text fill="#091b42" font-family="'Inter', -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="37" letter-spacing="6px">
    <textPath href="#bottomTextArc" startOffset="50%" text-anchor="middle">
      G . C . D . I . S
    </textPath>
  </text>

  <!-- Lateral Separation Dots -->
  <circle cx="75" cy="250" r="13" fill="#091b42" />
  <circle cx="425" cy="250" r="13" fill="#091b42" />

  <!-- Inner Concentric Boundary Ring -->
  <circle cx="250" cy="250" r="148" fill="none" stroke="#091b42" stroke-width="6" />

  <!-- Central Drone Structure -->
  <!-- 4 Diagonal Tubular Truss Arms -->
  <line x1="250" y1="250" x2="182" y2="182" stroke="#091b42" stroke-width="12" stroke-linecap="round" />
  <line x1="250" y1="250" x2="318" y2="182" stroke="#091b42" stroke-width="12" stroke-linecap="round" />
  <line x1="250" y1="250" x2="182" y2="318" stroke="#091b42" stroke-width="12" stroke-linecap="round" />
  <line x1="250" y1="250" x2="318" y2="318" stroke="#091b42" stroke-width="12" stroke-linecap="round" />

  <!-- 4 Motor Hub Solid Disks -->
  <circle cx="182" cy="182" r="14" fill="#091b42" />
  <circle cx="318" cy="182" r="14" fill="#091b42" />
  <circle cx="182" cy="318" r="14" fill="#091b42" />
  <circle cx="318" cy="318" r="14" fill="#091b42" />

  <!-- 4 Propeller Guard Protective Rings -->
  <circle cx="182" cy="182" r="46" fill="none" stroke="#091b42" stroke-width="6" />
  <circle cx="318" cy="182" r="46" fill="none" stroke="#091b42" stroke-width="6" />
  <circle cx="182" cy="318" r="46" fill="none" stroke="#091b42" stroke-width="6" />
  <circle cx="318" cy="318" r="46" fill="none" stroke="#091b42" stroke-width="6" />

  <!-- Dynamic Propeller Aerodynamic Flow Arcs inside each ring -->
  <!-- Top Left Rotor Vortex -->
  <path d="M 148,172 A 38,38 0 0,1 214,162" fill="none" stroke="#091b42" stroke-width="3" stroke-linecap="round" />
  <path d="M 152,194 A 38,38 0 0,0 212,204" fill="none" stroke="#091b42" stroke-width="3" stroke-linecap="round" />

  <!-- Top Right Rotor Vortex -->
  <path d="M 286,162 A 38,38 0 0,1 352,172" fill="none" stroke="#091b42" stroke-width="3" stroke-linecap="round" />
  <path d="M 288,204 A 38,38 0 0,0 348,194" fill="none" stroke="#091b42" stroke-width="3" stroke-linecap="round" />

  <!-- Bottom Left Rotor Vortex -->
  <path d="M 148,308 A 38,38 0 0,1 214,298" fill="none" stroke="#091b42" stroke-width="3" stroke-linecap="round" />
  <path d="M 152,330 A 38,38 0 0,0 212,340" fill="none" stroke="#091b42" stroke-width="3" stroke-linecap="round" />

  <!-- Bottom Right Rotor Vortex -->
  <path d="M 286,298 A 38,38 0 0,1 352,308" fill="none" stroke="#091b42" stroke-width="3" stroke-linecap="round" />
  <path d="M 288,340 A 38,38 0 0,0 348,330" fill="none" stroke="#091b42" stroke-width="3" stroke-linecap="round" />

  <!-- Center Avionics Core Outer Ring -->
  <circle cx="250" cy="250" r="60" fill="#ffffff" stroke="#091b42" stroke-width="8" />

  <!-- Galgotias Emblem Flame Swirl (Red, Yellow, Cyan) -->
  <g transform="translate(250, 250)">
    <!-- Red/Orange outer sweep -->
    <path d="M -4,34 C -22,33 -38,18 -38,-4 C -38,-24 -24,-36 -4,-38 C -14,-28 -18,-14 -12,0 C -6,14 4,24 18,28 C 10,32 0,34 -4,34 Z" fill="url(#redFlame)" />
    
    <!-- Yellow middle sweep -->
    <path d="M -6,-38 C 12,-38 28,-26 34,-10 C 37,-1 35,10 28,18 C 28,8 24,-2 14,-10 C 4,-18 -8,-24 -6,-38 Z" fill="url(#yellowFlame)" />

    <!-- Cyan inner bird/flame head & eye -->
    <path d="M 28,18 C 22,24 14,26 6,24 C 12,18 16,8 14,-2 C 12,-12 4,-18 -6,-22 C 4,-20 14,-12 18,-4 C 22,4 25,12 28,18 Z" fill="url(#cyanFlame)" />
    <circle cx="6" cy="-4" r="3.5" fill="#ffffff" />
  </g>
</svg>
