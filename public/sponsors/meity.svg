<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 80" width="100%" height="100%">
  <!-- MeitY Government Insignia -->
  <g transform="translate(18, 10)">
    <!-- Ashoka / Digital Hub Emblem -->
    <circle cx="30" cy="30" r="28" fill="#f8fafc" stroke="#1e3a8a" stroke-width="2"/>
    <circle cx="30" cy="30" r="18" fill="none" stroke="#f97316" stroke-width="2" stroke-dasharray="3,2"/>
    <!-- Central Digital Node -->
    <circle cx="30" cy="30" r="6" fill="#1e3a8a"/>
    <line x1="30" y1="12" x2="30" y2="48" stroke="#1e3a8a" stroke-width="1.5"/>
    <line x1="12" y1="30" x2="48" y2="30" stroke="#1e3a8a" stroke-width="1.5"/>
    <circle cx="30" cy="12" r="3" fill="#f97316"/>
    <circle cx="48" cy="30" r="3" fill="#1e3a8a"/>
    <circle cx="30" cy="48" r="3" fill="#16a34a"/>
    <circle cx="12" cy="30" r="3" fill="#1e3a8a"/>
  </g>
  <!-- Wordmark -->
  <text x="90" y="35" font-family="Arial Black, sans-serif" font-size="22" font-weight="900" fill="#1e3a8a" letter-spacing="2">MeitY</text>
  <text x="91" y="49" font-family="Arial, sans-serif" font-size="9.5" font-weight="800" fill="#f97316" letter-spacing="1.8">STARTUP HUB</text>
  <text x="91" y="61" font-family="Arial, sans-serif" font-size="7" font-weight="700" fill="#475569" letter-spacing="1">MINISTRY OF ELECTRONICS &amp; IT, GOI</text>
</svg>