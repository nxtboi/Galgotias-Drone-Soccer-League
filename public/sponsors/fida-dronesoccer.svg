    <circle cx="30" cy="30" r="3.5" fill="#f43f5e"/>
    <!-- Flight Motion Arcs -->
    <path d="M6 18 Q30 0 54 18" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="3,2"/>
  </g>
  <!-- Typography -->
  <text x="92" y="38" font-family="Arial Black, Impact, sans-serif" font-size="28" font-weight="900" fill="#081426" letter-spacing="4">FIDA</text>
  <text x="94" y="52" font-family="Arial, sans-serif" font-size="8.5" font-weight="800" fill="#0284c7" letter-spacing="1.8">FEDERATION OF INTERNATIONAL</text>
  <text x="94" y="64" font-family="Arial, sans-serif" font-size="8.5" font-weight="800" fill="#081426" letter-spacing="2">DRONE SOCCER</text>
</svg>