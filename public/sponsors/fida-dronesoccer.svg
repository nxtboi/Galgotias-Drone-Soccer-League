<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 80" width="100%" height="100%">
  <!-- FIDA Sphere Icon -->
  <g transform="translate(18, 10)">
    <circle cx="30" cy="30" r="28" fill="#081426" stroke="#0284c7" stroke-width="2"/>
    <!-- Geodesic Drone Soccer Sphere Netting -->
    <polygon points="30,8 48,18 48,42 30,52 12,42 12,18" fill="none" stroke="#0ea5e9" stroke-width="1.5"/>
    <circle cx="30" cy="30" r="14" fill="#0284c7" opacity="0.25"/>
    <!-- Center Target Goal Hoop -->
