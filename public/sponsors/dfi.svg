<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 80" width="100%" height="100%">
  <!-- DFI Indian Tricolor Hexacopter Ring -->
  <g transform="translate(18, 10)">
    <circle cx="30" cy="30" r="28" fill="none" stroke="#000080" stroke-width="2"/>
    <path d="M30 4 A26 26 0 0 1 56 30" fill="none" stroke="#ff9933" stroke-width="4.5"/>
    <path d="M4 30 A26 26 0 0 0 30 56" fill="none" stroke="#138808" stroke-width="4.5"/>
    <!-- Hexacopter Drone Arms -->
    <circle cx="30" cy="30" r="8" fill="#000080"/>
    <line x1="30" y1="12" x2="30" y2="48" stroke="#000080" stroke-width="2"/>
    <line x1="14" y1="21" x2="46" y2="39" stroke="#000080" stroke-width="2"/>
    <line x1="14" y1="39" x2="46" y2="21" stroke="#000080" stroke-width="2"/>
    <circle cx="30" cy="12" r="3" fill="#ff9933"/>
    <circle cx="46" cy="21" r="3" fill="#ff9933"/>
    <circle cx="46" cy="39" r="3" fill="#138808"/>
    <circle cx="30" cy="48" r="3" fill="#138808"/>
    <circle cx="14" cy="39" r="3" fill="#138808"/>
    <circle cx="14" cy="21" r="3" fill="#ff9933"/>
  </g>
  <!-- Wordmark -->
  <text x="92" y="38" font-family="Arial Black, Impact, sans-serif" font-size="28" font-weight="900" fill="#000080" letter-spacing="3">DFI</text>
  <text x="94" y="52" font-family="Arial, sans-serif" font-size="8.5" font-weight="800" fill="#ff9933" letter-spacing="1.2">DRONE FEDERATION</text>
  <text x="94" y="63" font-family="Arial, sans-serif" font-size="8.5" font-weight="800" fill="#138808" letter-spacing="2.5">OF INDIA</text>
</svg>