    <path d="M 206 520 L 152 635" />
    <path d="M 213 520 L 161 635" />
    <path d="M 220 520 L 170 635" />

    <!-- Horizontal Cross-Tracks -->
    <line x1="0" y1="435" x2="600" y2="435" />
    <line x1="0" y1="465" x2="600" y2="465" />
    <line x1="0" y1="500" x2="600" y2="500" />
    <line x1="0" y1="542" x2="600" y2="542" />
    <line x1="0" y1="590" x2="600" y2="590" />
    <line x1="0" y1="648" x2="600" y2="648" />
    <line x1="0" y1="715" x2="600" y2="715" />
    <line x1="0" y1="795" x2="600" y2="795" />
  </g>

  <!-- Primary Glowing Neon Circuit Pathways -->
  <g stroke="url(#traceBright)" stroke-width="2.2" fill="none" filter="url(#neonGlow)">
