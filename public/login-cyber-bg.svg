  <g stroke="#29e058" stroke-opacity="0.38" stroke-width="1" fill="none">
    <!-- Central Parallel Bus Block -->
    <path d="M 270 500 L 235 615" />
    <path d="M 276 500 L 243 615" />
    <path d="M 282 500 L 251 615" />
    <path d="M 288 500 L 259 615" />
    <path d="M 294 500 L 267 615" />
    <path d="M 300 500 L 275 615" />
    <path d="M 306 500 L 283 615" />
    <path d="M 312 500 L 291 615" />
    <path d="M 318 500 L 299 615" />
    <path d="M 324 500 L 307 615" />
    <path d="M 330 500 L 315 615" />
    <path d="M 336 500 L 323 615" />
    <path d="M 342 500 L 331 615" />
    <path d="M 348 500 L 339 615" />
    <path d="M 354 500 L 347 615" />

    <!-- Lower-Right Parallel Bus Block -->
    <path d="M 355 680 L 395 850" />
    <path d="M 363 680 L 405 850" />
    <path d="M 371 680 L 415 850" />
    <path d="M 379 680 L 425 850" />
    <path d="M 387 680 L 435 850" />
