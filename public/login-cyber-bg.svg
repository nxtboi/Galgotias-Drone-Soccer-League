    <path d="M 285 480 L 410 480 L 448 565 L 570 565" />
    <path d="M 335 585 L 420 585 L 465 705 L 560 705" />
    <path d="M 22 652 L 88 652 L 42 752 L 155 752" />
    <path d="M 480 635 L 580 635 L 600 665" />
  </g>

