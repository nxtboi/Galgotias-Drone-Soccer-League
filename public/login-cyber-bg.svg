  <g fill="#4dff7c" filter="url(#neonGlow)">
    <!-- Cluster 1: Upper-left matrix block (x: 136..178, y: 245..295) -->
    <g opacity="0.9">
      <rect x="136" y="252" width="4" height="4" rx="1" /><rect x="143" y="252" width="4" height="4" rx="1" /><rect x="150" y="252" width="4" height="4" rx="1" /><rect x="157" y="252" width="4" height="4" rx="1" />
      <rect x="136" y="259" width="4" height="4" rx="1" /><rect x="143" y="259" width="4" height="4" rx="1" /><rect x="150" y="259" width="4" height="4" rx="1" /><rect x="157" y="259" width="4" height="4" rx="1" /><rect x="164" y="259" width="4" height="4" rx="1" />
      <rect x="136" y="266" width="4" height="4" rx="1" /><rect x="143" y="266" width="4" height="4" rx="1" /><rect x="150" y="266" width="4" height="4" rx="1" /><rect x="157" y="266" width="4" height="4" rx="1" /><rect x="164" y="266" width="4" height="4" rx="1" /><rect x="171" y="266" width="4" height="4" rx="1" />
      <rect x="136" y="273" width="4" height="4" rx="1" /><rect x="143" y="273" width="4" height="4" rx="1" /><rect x="150" y="273" width="4" height="4" rx="1" /><rect x="157" y="273" width="4" height="4" rx="1" /><rect x="164" y="273" width="4" height="4" rx="1" />
      <rect x="136" y="280" width="4" height="4" rx="1" /><rect x="143" y="280" width="4" height="4" rx="1" /><rect x="150" y="280" width="4" height="4" rx="1" /><rect x="157" y="280" width="4" height="4" rx="1" />
      <rect x="143" y="287" width="4" height="4" rx="1" /><rect x="150" y="287" width="4" height="4" rx="1" /><rect x="157" y="287" width="4" height="4" rx="1" />
    </g>

    <!-- Cluster 2: Lower-left bright matrix block (x: 88..136, y: 332..378) -->
    <g opacity="0.95" fill="#7aff9e">
      <rect x="88" y="335" width="4.5" height="4.5" rx="1" /><rect x="95" y="335" width="4.5" height="4.5" rx="1" /><rect x="102" y="335" width="4.5" height="4.5" rx="1" /><rect x="109" y="335" width="4.5" height="4.5" rx="1" /><rect x="116" y="335" width="4.5" height="4.5" rx="1" /><rect x="123" y="335" width="4.5" height="4.5" rx="1" />
      <rect x="88" y="342" width="4.5" height="4.5" rx="1" /><rect x="95" y="342" width="4.5" height="4.5" rx="1" /><rect x="102" y="342" width="4.5" height="4.5" rx="1" /><rect x="109" y="342" width="4.5" height="4.5" rx="1" /><rect x="116" y="342" width="4.5" height="4.5" rx="1" /><rect x="123" y="342" width="4.5" height="4.5" rx="1" />
      <rect x="88" y="349" width="4.5" height="4.5" rx="1" /><rect x="95" y="349" width="4.5" height="4.5" rx="1" /><rect x="102" y="349" width="4.5" height="4.5" rx="1" /><rect x="109" y="349" width="4.5" height="4.5" rx="1" /><rect x="116" y="349" width="4.5" height="4.5" rx="1" /><rect x="123" y="349" width="4.5" height="4.5" rx="1" />
      <rect x="88" y="356" width="4.5" height="4.5" rx="1" /><rect x="95" y="356" width="4.5" height="4.5" rx="1" /><rect x="102" y="356" width="4.5" height="4.5" rx="1" /><rect x="109" y="356" width="4.5" height="4.5" rx="1" /><rect x="116" y="356" width="4.5" height="4.5" rx="1" /><rect x="123" y="356" width="4.5" height="4.5" rx="1" />
      <rect x="88" y="363" width="4.5" height="4.5" rx="1" /><rect x="95" y="363" width="4.5" height="4.5" rx="1" /><rect x="102" y="363" width="4.5" height="4.5" rx="1" /><rect x="109" y="363" width="4.5" height="4.5" rx="1" /><rect x="116" y="363" width="4.5" height="4.5" rx="1" /><rect x="123" y="363" width="4.5" height="4.5" rx="1" />
      <rect x="88" y="370" width="4.5" height="4.5" rx="1" /><rect x="95" y="370" width="4.5" height="4.5" rx="1" /><rect x="102" y="370" width="4.5" height="4.5" rx="1" /><rect x="109" y="370" width="4.5" height="4.5" rx="1" /><rect x="116" y="370" width="4.5" height="4.5" rx="1" /><rect x="123" y="370" width="4.5" height="4.5" rx="1" />
    </g>

    <!-- Cluster 3: Far-left secondary matrix (x: 40..75, y: 335..365) -->
    <g opacity="0.6">
      <rect x="42" y="335" width="4" height="4" /><rect x="49" y="335" width="4" height="4" /><rect x="56" y="335" width="4" height="4" /><rect x="63" y="335" width="4" height="4" />
      <rect x="42" y="342" width="4" height="4" /><rect x="49" y="342" width="4" height="4" /><rect x="56" y="342" width="4" height="4" /><rect x="63" y="342" width="4" height="4" />
      <rect x="42" y="349" width="4" height="4" /><rect x="49" y="349" width="4" height="4" /><rect x="56" y="349" width="4" height="4" /><rect x="63" y="349" width="4" height="4" />
      <rect x="42" y="356" width="4" height="4" /><rect x="49" y="356" width="4" height="4" /><rect x="56" y="356" width="4" height="4" /><rect x="63" y="356" width="4" height="4" />
    </g>

    <!-- Cluster 4: Vertical spine dots at x=112..126, y=280..330 -->
    <g opacity="0.7">
      <rect x="112" y="285" width="3.5" height="3.5" /><rect x="119" y="285" width="3.5" height="3.5" />
      <rect x="112" y="292" width="3.5" height="3.5" /><rect x="119" y="292" width="3.5" height="3.5" />
      <rect x="112" y="299" width="3.5" height="3.5" /><rect x="119" y="299" width="3.5" height="3.5" />
      <rect x="112" y="306" width="3.5" height="3.5" /><rect x="119" y="306" width="3.5" height="3.5" />
      <rect x="112" y="313" width="3.5" height="3.5" /><rect x="119" y="313" width="3.5" height="3.5" />
      <rect x="112" y="320" width="3.5" height="3.5" /><rect x="119" y="320" width="3.5" height="3.5" />
