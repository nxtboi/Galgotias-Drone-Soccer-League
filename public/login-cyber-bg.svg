    <!-- Left foreground ladder -->
    <rect x="48" y="775" width="12" height="3" transform="skewX(-28 48 775)" />
    <rect x="48" y="782" width="12" height="3" transform="skewX(-28 48 782)" />
    <rect x="48" y="789" width="12" height="3" transform="skewX(-28 48 789)" />
    <rect x="48" y="796" width="12" height="3" transform="skewX(-28 48 796)" />
