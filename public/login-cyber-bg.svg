<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 900" width="600" height="900">
  <defs>
    <!-- Deep Dark Cyber Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#020804" />
      <stop offset="28%" stop-color="#041509" />
      <stop offset="48%" stop-color="#0b3818" />
      <stop offset="68%" stop-color="#072810" />
      <stop offset="100%" stop-color="#010602" />
    </linearGradient>

    <!-- Right-Center Intense Neon Green Horizon Bloom -->
    <radialGradient id="horizonBloom" cx="68%" cy="52%" r="55%">
      <stop offset="0%" stop-color="#6eff8a" stop-opacity="0.75" />
      <stop offset="30%" stop-color="#19d84b" stop-opacity="0.45" />
      <stop offset="65%" stop-color="#085c1e" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#020804" stop-opacity="0" />
    </radialGradient>

    <!-- Secondary Left-Center Glow -->
    <radialGradient id="leftBloom" cx="28%" cy="46%" r="42%">
      <stop offset="0%" stop-color="#3bff6c" stop-opacity="0.45" />
      <stop offset="45%" stop-color="#109c34" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#020804" stop-opacity="0" />
    </radialGradient>

    <!--Glowing Data Node Radial -->
    <radialGradient id="nodeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1" />
      <stop offset="25%" stop-color="#b8ffca" stop-opacity="0.95" />
      <stop offset="55%" stop-color="#22ff5e" stop-opacity="0.55" />
      <stop offset="100%" stop-color="#10b940" stop-opacity="0" />
    </radialGradient>

    <!-- Soft Bokeh Orb Radial -->
    <radialGradient id="bokehOrb" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7dff9b" stop-opacity="0.55" />
      <stop offset="50%" stop-color="#1ed74f" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#063b14" stop-opacity="0" />
    </radialGradient>

    <!-- Vertical Cyber Pillar Gradient -->
    <linearGradient id="pillarGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#26e858" stop-opacity="0" />
      <stop offset="35%" stop-color="#4aff78" stop-opacity="0.38" />
      <stop offset="75%" stop-color="#9effb5" stop-opacity="0.65" />
      <stop offset="100%" stop-color="#16b841" stop-opacity="0.05" />
    </linearGradient>

    <!-- Bright Circuit Trace Gradient -->
    <linearGradient id="traceBright" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#168a32" stop-opacity="0.3" />
      <stop offset="45%" stop-color="#49ff77" stop-opacity="0.85" />
      <stop offset="70%" stop-color="#d4ffdf" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#147a2c" stop-opacity="0.25" />
    </linearGradient>

    <linearGradient id="traceSubtle" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0f5c22" stop-opacity="0.15" />
      <stop offset="50%" stop-color="#28d154" stop-opacity="0.55" />
      <stop offset="100%" stop-color="#0f5c22" stop-opacity="0.15" />
    </linearGradient>

    <!-- Filters for Bokeh & Neon Glow -->
    <filter id="heavyBlur" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="24" />
    </filter>
    <filter id="medBlur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" />
    </filter>
    <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- 1. Base Dark Cyberspace Backdrop -->
  <rect width="600" height="900" fill="url(#bgGrad)" />
  <rect width="600" height="900" fill="url(#horizonBloom)" />
  <rect width="600" height="900" fill="url(#leftBloom)" />

  <!-- 2. Upper Atmosphere Out-of-Focus Bokeh Lights -->
  <g filter="url(#heavyBlur)">
    <circle cx="120" cy="85" r="55" fill="url(#bokehOrb)" />
    <circle cx="195" cy="40" r="42" fill="url(#bokehOrb)" />
    <circle cx="95" cy="175" r="38" fill="url(#bokehOrb)" />
    <circle cx="460" cy="110" r="68" fill="url(#bokehOrb)" />
    <circle cx="545" cy="65" r="50" fill="url(#bokehOrb)" />
    <circle cx="330" cy="160" r="45" fill="url(#bokehOrb)" />
    <circle cx="270" cy="240" r="60" fill="url(#bokehOrb)" />
    <circle cx="490" cy="250" r="75" fill="url(#bokehOrb)" />
    <circle cx="130" cy="820" r="50" fill="url(#bokehOrb)" />
    <circle cx="430" cy="850" r="60" fill="url(#bokehOrb)" />
  </g>

  <!-- 3. Mid-Ground Cyber Data Towers / Vertical Light Pillars -->
  <g opacity="0.75">
    <rect x="68" y="210" width="24" height="160" fill="url(#pillarGrad)" filter="url(#medBlur)" />
    <rect x="115" y="240" width="18" height="140" fill="url(#pillarGrad)" filter="url(#medBlur)" />
    <rect x="235" y="220" width="34" height="190" fill="url(#pillarGrad)" filter="url(#medBlur)" />
    <rect x="290" y="195" width="46" height="220" fill="url(#pillarGrad)" filter="url(#medBlur)" />
    <rect x="355" y="230" width="28" height="185" fill="url(#pillarGrad)" filter="url(#medBlur)" />
    <rect x="425" y="185" width="40" height="230" fill="url(#pillarGrad)" filter="url(#medBlur)" />
    <rect x="498" y="170" width="38" height="240" fill="url(#pillarGrad)" filter="url(#medBlur)" />
    <rect x="548" y="215" width="26" height="200" fill="url(#pillarGrad)" filter="url(#medBlur)" />
  </g>

  <!-- Crisp Vertical Data Streams -->
  <g stroke="#5cff87" stroke-opacity="0.35" stroke-width="1">
    <line x1="80" y1="220" x2="80" y2="390" stroke-dasharray="3 6" />
    <line x1="145" y1="240" x2="145" y2="410" stroke-dasharray="2 5" />
    <line x1="252" y1="210" x2="252" y2="420" stroke-dasharray="4 4" />
    <line x1="312" y1="190" x2="312" y2="430" stroke-dasharray="2 4" />
    <line x1="342" y1="220" x2="342" y2="430" stroke-dasharray="6 3" />
    <line x1="378" y1="240" x2="378" y2="435" stroke-dasharray="3 5" />
    <line x1="445" y1="195" x2="445" y2="430" stroke-dasharray="4 6" />
    <line x1="515" y1="180" x2="515" y2="425" stroke-dasharray="3 4" />
  </g>

