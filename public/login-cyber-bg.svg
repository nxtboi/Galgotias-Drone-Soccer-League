    <path d="M 0 490 L 95 490 L 65 555 L 155 555 L 95 685 L 0 685" />
    <path d="M 215 445 L 175 515 L 255 515 L 210 630 L 115 630 L 45 785" />
    <path d="M 0 640 L 75 640 L 15 765 L 115 765 L 65 890" />
    <path d="M 260 465 L 220 565 L 140 565 L 85 695 L 195 695 L 140 835" />

    <!-- Center-to-Right High-Energy Data Highways -->
