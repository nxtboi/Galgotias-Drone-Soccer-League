    <rect x="525" y="669" width="10" height="2.5" transform="skewX(24 525 669)" />
    <rect x="525" y="675" width="10" height="2.5" transform="skewX(24 525 675)" />
    <rect x="525" y="681" width="10" height="2.5" transform="skewX(24 525 681)" />
