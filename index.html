<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Galgotias Drone Soccer League · GDSL | GCDIS Championship</title>
    <meta name="description" content="Official website for the Galgotias Drone Soccer League (GDSL). The premier FAI-format 3D aerial robotics championship hosted by GCDIS at Galgotias University." />
    <meta property="og:title" content="Galgotias Drone Soccer League · GDSL | GCDIS Championship" />
    <meta property="og:description" content="Join the high-speed 3D aerial e-sport clash: 32 university teams, ₹1,00,000 prize pool, caged sphere soccer drones, and live arena tournament brackets." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link id="app-favicon" rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link id="app-favicon-png" rel="alternate icon" type="image/png" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <script>
      (function () {
        var img = new Image();
        img.crossOrigin = 'anonymous';
        img.onload = function () {
          var size = 256;
          var canvas = document.createElement('canvas');
          canvas.width = size;
          canvas.height = size;
          var ctx = canvas.getContext('2d');
          if (!ctx) return;
          ctx.beginPath();
          ctx.arc(size / 2, size / 2, size / 2, 0, Math.PI * 2);
          ctx.closePath();
          ctx.clip();
          var crop = img.width * 0.032;
          ctx.drawImage(
            img,
            crop,
            crop,
            img.width - crop * 2,
            img.height - crop * 2,
            0,
            0,
            size,
            size
          );
          var circularUrl = canvas.toDataURL('image/png');
          var iconLink = document.getElementById('app-favicon');
          if (iconLink) {
            iconLink.setAttribute('type', 'image/png');
            iconLink.setAttribute('href', circularUrl);
          }
          var pngLink = document.getElementById('app-favicon-png');
          if (pngLink) {
            pngLink.setAttribute('href', circularUrl);
          }
        };
        img.src = '/assets/aistudio/GCDIS_HD_Logo_aeb80099.png';
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100;300;400;500;600;700;800;900&family=Orbitron:wght@600;700;800;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body class="bg-white text-slate-900 selection:bg-blue-100 selection:text-blue-950 font-sans overflow-x-hidden antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
